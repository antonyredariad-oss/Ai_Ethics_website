<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة أخلاقيات الذكاء الاصطناعي - ذكاء بأخلاق</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <!-- Font Awesome لإظهار الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Style الملف الخارجي -->
    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/jpeg" href="img/1dabd346-ee70-464e-b8fa-806f057bb779.jpeg">

    <!-- Open Graph Meta Tags لمشاركة اللينك -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="مسابقة أخلاقيات الذكاء الاصطناعي - ذكاء بأخلاق">
    <meta property="og:description" content="دليل المبادئ الأخلاقية للذكاء الاصطناعي - القواعد والأسس لضمان استخدام التكنولوجيا بشكل آمن ومسؤول.">
    <meta property="og:image" content="https://YOUR-DOMAIN.netlify.app/img/1dabd346-ee70-464e-b8fa-806f057bb779.jpeg">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
            /* كود الخلفية الهندسية المميزة الخاص بك */
            background: linear-gradient(30deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
                        linear-gradient(150deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
                        linear-gradient(30deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
                        linear-gradient(150deg, #111111 12%, transparent 12.5%, transparent 87%, #111111 87.5%, #111111),
                        linear-gradient(60deg, #77777777 25%, transparent 25.5%, transparent 75%, #77777777 75%, #77777777),
                        linear-gradient(60deg, #77777777 25%, transparent 25.5%, transparent 75%, #77777777 75%, #77777777),
                        #000000;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px, 0 0, 40px 70px;
            background-size: 80px 140px;
            background-attachment: fixed;
            box-shadow: inset 0 0 100px rgba(255, 215, 0, 0.1);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        h2 {
            text-align: center;
            color: #cbd5e1;
        }
        .instructions {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        /* بطاقات الأسئلة الشفافة المتوافقة مع الخلفية الداكنة */
        .question {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-right: 5px solid #38bdf8;
            transition: all 0.3s ease;
        }
        .question p {
            font-weight: bold;
            margin-top: 0;
            color: #f1f5f9;
        }
        label {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s, border-color 0.2s;
            color: #cbd5e1;
        }
        label:hover {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }
        input[type="radio"] {
            margin-left: 10px;
            accent-color: #38bdf8;
        }
        .btn-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        .btn {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-back {
            background: rgba(108, 117, 125, 0.8);
            width: auto;
            padding: 8px 20px;
            font-size: 0.9em;
            float: right;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-back:hover {
            background: #5a6268;
        }
        .nav-container {
            overflow: hidden;
            margin-bottom: 20px;
        }
        .result {
            font-weight: bold;
            font-size: 1.4em;
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- حاوية زر الرجوع العلوي -->
    <div class="nav-container">
        <a href="index.html" class="btn btn-back">رجوع للرئيسية</a>
    </div>

    <h1>مرحباً! أنا روبو! 👋</h1>
    <h2>الاختبار الأول: أساسيات الذكاء الاصطناعي والآلات الذكية</h2>
    <p class="instructions">اختر الإجابة الصحيحة لكل سؤال:</p>

    <!-- حاوية الأسئلة المختبرة -->
    <div id="quiz-container"></div>

    <!-- زر إرسال الإجابات للتصحيح -->
    <div class="btn-container">
        <button class="btn" onclick="checkAnswers()">إرسال الاختبار</button>
    </div>

    <!-- مكان عرض النتيجة -->
    <div id="result" class="result"></div>
    <hr>
</div>
    <footer class="text-white text-center py-5" style="position: relative; z-index: 10; background: linear-gradient(180deg, #090c10 0%, #0f1319 100%); border-top: 2px solid #38bdf8; box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);">
        <div class="container">
            <div class="mb-4 d-inline-block px-4 py-2 rounded-pill" style="background: rgba(56, 189, 248, 0.06); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);">
                <h5 class="mb-0 fw-bold text-uppercase tracking-wide" style="color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); font-size: 1.3rem;">
                    🎯  أخلاقيات الذكاء الاصطناعي 2026
                </h5>
            </div>
            
            <div class="mx-auto my-3" style="width: 80px; height: 2px; background: linear-gradient(90deg, transparent, #38bdf8, transparent); opacity: 0.7;"></div>
            
            <div class="d-flex flex-wrap justify-content-center align-items-center gap-3 mt-4">
                
                <div class="px-3 py-2 rounded-3 shadow-sm text-secondary fs-6" style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07);">
                    تصميم وإعداد الطالب: <strong class="text-white ms-1 fw-bold" style="color: #ffffff;">أنطوني رضا</strong>
                </div>
                <span class="d-none d-md-inline text-muted opacity-25">|</span>
                <div class="px-3 py-2 rounded-3 shadow-sm text-secondary fs-6" style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07);">
                    مدرسة: <span class="fw-semibold" style="color: #94a3b8;">الشيخ زايد الحي الأول الرسمية للغات</span>
                </div>
                
            </div>
        </div>
    </footer>
<script>
const questions = [
    { q: "1. ماذا يعني مصطلح AI؟", a: "الذكاء الاصطناعي (Artificial Intelligence)", b: "إنترنت آبل (Apple Internet)", correct: "a" },
    { q: "2. هل الذكاء الاصطناعي هو كمبيوتر ذكي؟", a: "نعم", b: "لا", correct: "a" },
    { q: "3. هل يمكن للذكاء الاصطناعي أن يتعلم؟", a: "نعم", b: "لا", correct: "a" },
    { q: "4. هل الروبوت مثال على استخدام الذكاء الاصطناعي؟", a: "نعم", b: "لا", correct: "a" },
    { q: "5. ما هي التقنية التي تجعل الآلات تحاكي وتتعلم مثل العقل البشري؟", a: "الذكاء الاصطناعي", b: "الآلة الحاسبة البسيطة", correct: "a" },
    { q: "6. هل تحتاج أنظمة الذكاء الاصطناعي إلى بيانات (Data) لكي تتعلم؟", a: "نعم، تحتاج لبيانات كثيرة", b: "لا، تعمل بدون بيانات", correct: "a" },
    { q: "7. أي مما يلي يعتمد على الذكاء الاصطناعي بشكل كامل؟", a: "السيارات ذاتية القيادة", b: "الدراجة الهوائية العادية", correct: "a" },
    { q: "8. ماذا يُطلق على الجزء المسؤول عن تفكير الروبوت واتخاذ القرارات؟", a: "برنامج الذكاء الاصطناعي (العقل)", b: "الهيكل المعدني الخارجي", correct: "a" },
    { q: "9. هل يمتلك الذكاء الاصطناعي مشاعر حقيقية مثل الفرح والحزن؟", a: "نعم، لديه مشاعر", b: "لا، هو مجرد خوارزميات وأكواد", correct: "b" },
    { q: "10. ما هو دور 'تعلم الآلة' (Machine Learning)؟", a: "جعل الآلة تتطور وتتحسن من تلقاء نفسها عبر التجربة", b: "تنظيف الأجزاء الخارجية للآلة", correct: "a" }
];

const container = document.getElementById('quiz-container');

// عرض الأسئلة في الصفحة
questions.forEach((item, index) => {
    container.innerHTML += `
        <div class="question" id="section-q${index}">
            <p>${item.q}</p>
            <label id="label-q${index}-a">
                <input type="radio" name="q${index}" value="a"> أ) ${item.a}
            </label>
            <label id="label-q${index}-b">
                <input type="radio" name="q${index}" value="b"> ب) ${item.b}
            </label>
        </div>
    `;
});

function checkAnswers() {
    let score = 0;
    const totalQuestions = questions.length;

    questions.forEach((item, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        
        // إعادة تعيين الألوان السابقة إذا وجدت
        document.getElementById(`label-q${index}-a`).className = '';
        document.getElementById(`label-q${index}-b`).className = '';
        
        // تلوين الإجابة الصحيحة دائماً بعد الإرسال
        document.getElementById(`label-q${index}-${item.correct}`).className = 'correct-answer';
        
        if (selected) {
            if (selected.value === item.correct) {
                score++;
            } else {
                // إذا كانت إجابة المستخدم خاطئة، تلون بالأحمر
                document.getElementById(`label-q${index}-${selected.value}`).className = 'wrong-answer';
            }
        }
        
        // تعطيل الاختيارات بعد الإرسال لمنع التعديل
        const inputs = document.getElementsByName(`q${index}`);
        inputs.forEach(input => input.disabled = true);
    });

    // عرض النتيجة النهائية وتنسيقها
    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.innerText = `نتيجتك هي: ${score} من ${totalQuestions}`;
    
    if (score >= 7) {
        resultDiv.style.color = '#155724';
        resultDiv.style.backgroundColor = 'rgba(212, 237, 218, 0.8)';
        resultDiv.style.border = '1px solid #c3e6cb';
    } else {
        resultDiv.style.color = '#721c24';
        resultDiv.style.backgroundColor = 'rgba(248, 215, 218, 0.8)';
        resultDiv.style.border = '1px solid #f5c6cb';
    }
}
</script>
</body>
</html>
